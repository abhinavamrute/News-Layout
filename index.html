<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Layout</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header class="heading">
      <div class="site-header">
        <h1 id="logo">NEWSLETTER</h1>
        <div class="searchr">
          <input type="text" placeholder="Search for the Headlines" id="search">
          <input type="submit" value="SEARCH" id="submit-btn">
        </div>
      </div>
    </header>

    <nav class="nav-bar">
      <div class="nav-list">
        <div class="cg">HOME</div>
        <div class="cg">WORLD</div>
        <div class="cg">ECONOMY</div>
        <div class="cg">Science & Tech</div>
        <div class="cg">Business</div>
        <div class="cg">Travel</div>
        <div class="cg">Climate</div>
        <div class="cg">Lifestyle</div>
        <div class="cg">Food</div>
        <div class="cg">Sports</div>
      </div>
    </nav>
    <div class="main-container">
      <div class="coln1">
        <div class="top-stories">
          <h1>Top Stories</h1>
        </div>
      </div>
      <div class="coln2">
        <div class="local-news">
          <h1>Local News</h1>
        </div>
      </div>
    </div>
  </body>
</html>
